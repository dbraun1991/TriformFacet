<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TriformFacet — live viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #style-switcher {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      #style-switcher button {
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
        background: rgba(20, 20, 20, 0.6);
        color: #eee;
        font-size: 13px;
        cursor: pointer;
      }
      #style-switcher button[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.85);
        color: #111;
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="style-switcher"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
